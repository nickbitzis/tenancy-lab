[project]
name = "tenancylab"
version = "1.0.0"
description = "One project management API built three ways (pooled, bridge, silo) to compare multi-tenant isolation, noisy neighbors, operations, and cost."
readme = "README.md"
license = "MIT"
authors = [{ name = "Nick Bitzis" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
tenancylab = "tenancylab.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenancylab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["redteam: cross-tenant leak attempts (the isolation gate)"]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
